control_rate_hz: 500.0
queue_size: 10
pose_topic: "pose"
reset_pose_topic: "reset_pose"
cmd_vel_topic: "cmd_vel"
state_timeout: 0.2
command_publish_rate_hz: 50.0
idle_cmd_rate_hz: 5.0
status_publish_rate_hz: 50.0
auto_start_tracking: false
reference_twist_topic: "alg/reference/twist"
heading_target_yaw: 0.0
track:
  kp_yaw: 1.2
reset:
  timeout: 600.0
# FLU |vx|,|vy| after R(ψ)^T. Not world ENU reference.
max_linear_speed: 1.0
max_yaw_rate: 1.0
# Physical fence: offset world ENU x,y (canonical pose). Not body, not raw VRPN.
fence:
  x_min: -20.0
  x_max: 20.0
  y_min: -20.0
  y_max: 20.0

# Reset needs an explicit reset_pose message or all three reset_initial_* params.
