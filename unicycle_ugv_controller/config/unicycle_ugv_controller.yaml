control_rate_hz: 500.0
queue_size: 10

state_estimate_topic: "alg/state_estimator/state"
state_source: "state_estimator"
tracking_strategy: "nmpc"
active_analytic_topic: "alg/unicycle_reference_trajectory/active/analytic"
active_polynomial_topic: "alg/unicycle_reference_trajectory/active/polynomial"
active_sampled_topic: "alg/unicycle_reference_trajectory/active/sampled"
pva_reference_topic: "alg/reference/pva"
cmd_vel_topic: "cmd_vel"

state_timeout: 0.2
command_publish_rate_hz: 50.0
idle_cmd_rate_hz: 5.0
auto_start_tracking: false
platform_pose_topic: "pose"
reset_pose_topic: "reset_pose"

reset:
  timeout: 45.0
  arrive_position: 0.05
  kp_along: 0.8
  kp_heading: 1.2

chassis:
  max_linear_speed: 1.05
  max_yaw_rate: 1.05

flatness:
  # Longitudinal PVA feedback; transverse bandwidth is speed / response length.
  lateral_response_length: 0.8  # metres
  lateral_damping: 1.0
  kp: 6.0
  kv: 4.0
  v_eps: 0.15

filter:
  zeta: 0.7071067811865476
  wn: 31.41592653589793
  dt_min: 0.0001
  dt_max: 0.2

fence:
  x_min: -20.0
  x_max: 20.0
  y_min: -20.0
  y_max: 20.0

reset_initial_x: 0.0
reset_initial_y: 0.0
reset_initial_yaw: 0.0

nmpc:
  control_period: 0.1
  prediction_horizon: 1.0
  request_rate_hz: 100.0
  solve_timeout: 0.05
  result_timeout: 0.1
  weights:
    position_x: 20.0
    position_y: 20.0
    yaw: 8.0
    speed: 4.0
    accel: 0.4
    omega: 10.0
    angular_accel: 1.0
    terminal_position_x: 60.0
    terminal_position_y: 60.0
    terminal_yaw: 20.0
    terminal_speed: 10.0

limits:
  min_linear_speed: -1.5
  max_linear_speed: 3.0
  max_angular_speed: 2.5
  max_linear_acceleration: 2.0
  max_angular_acceleration: 3.0
